# Katalog layer MAPID.
#
# Id dipatok di sini, tidak dicari otomatis. Proyek GEO MAPID menyimpan
# beberapa layer dengan nama yang sama persis, dan API-nya tetap melayani layer
# yang sudah masuk tempat sampah — jadi "bisa ditarik" bukan jaminan layernya
# masih hidup. Impor akan memberi tahu kalau ada id yang sudah di tempat sampah.

# Layer turunan OpenStreetMap. Cuma layer ini yang membawa osm_id, dan osm_id
# itu kunci sambungan ke poligon isochrone.
stations:
  - key: jakpus
    label: Stasiun Jakarta Pusat
    layer_id: "6a8c4f80ba6cb8dfce8ed2cf"
  - key: jakbar
    label: Stasiun Jakarta Barat
    layer_id: "6a9fb9addcb8de4208df0416"
  - key: jaksel
    label: Stasiun Jakarta Selatan
    layer_id: "6a9fbc0cdcb8de4208e06644"
  - key: jaktim
    label: Stasiun Jakarta Timur
    layer_id: "6a9fad6adcb8de4208da29f3"
  - key: jakut
    label: Stasiun Jakarta Utara
    layer_id: "6a9faffedcb8de4208daffe5"

# Poligon jangkauan jalan kaki. Semua id di bawah sudah dipastikan aktif.
# Tiap layer divalidasi saat impor: harus ada isinya, berprofil foot, dan
# time_limit-nya cocok dengan minutes. Kalau gagal, impornya berhenti.
isochrones:
  - { key: jakpus, minutes: 5,  layer_id: "6a9fac02753cb27abe00ed93" }
  - { key: jakpus, minutes: 10, layer_id: "6a9fac46753cb27abe010c56" }
  - { key: jakpus, minutes: 15, layer_id: "6a9fac76dcb8de4208d9d0ea" }
  - { key: jakbar, minutes: 5,  layer_id: "6a9fba41753cb27abe07e2ee" }
  - { key: jakbar, minutes: 10, layer_id: "6a9fba82753cb27abe08017f" }
  - { key: jakbar, minutes: 15, layer_id: "6a9fbaa3753cb27abe080c9d" }
  - { key: jaksel, minutes: 5,  layer_id: "6a9fbca2753cb27abe08c9ba" }
  - { key: jaksel, minutes: 10, layer_id: "6a9fbcdb753cb27abe08ceab" }
  - { key: jaksel, minutes: 15, layer_id: "6a9fbd08753cb27abe08d69c" }
  - { key: jaktim, minutes: 5,  layer_id: "6a9fae9b753cb27abe021d1b" }
  - { key: jaktim, minutes: 10, layer_id: "6a9faf65753cb27abe02aa72" }
  - { key: jaktim, minutes: 15, layer_id: "6a9faf95753cb27abe02af43" }
  - { key: jakut,  minutes: 5,  layer_id: "6a9fb113dcb8de4208dbceac" }
  - { key: jakut,  minutes: 10, layer_id: "6a9fb14a753cb27abe038172" }
  - { key: jakut,  minutes: 15, layer_id: "6a9fb179753cb27abe03a590" }

# Kategori titik minat yang dipakai, dan variabel SEPI yang disuapinya:
#   T transportasi, E ekonomi, U urban, C komersial.
#
# Daftar ini patokannya Jakarta Pusat — kategori di sini persis yang pernah
# lengkap di sana. Wilayah lain mengikuti kategori yang sama supaya angkanya
# bisa dibandingkan; tanpa itu, entropy weighting menghukum wilayah yang cuma
# kekurangan data, bukan yang benar-benar sepi.
#
# MINUMAN dan ROTI DAN KUE sengaja tidak masuk: keduanya terbukti 100% bagian
# dari MAKANAN DAN MINUMAN, jadi kalau ikut dihitung variabel C jadi berlipat.
poi_categories:
  - { category: makanan_minuman, variable: C, hint: "MAKANAN DAN MINUMAN" }
  - { category: alfamart,        variable: C, hint: "ALFAMART" }
  - { category: indomaret,       variable: C, hint: "INDOMARET" }
  - { category: coffee_shop,     variable: C, hint: "BRAND COFFEE SHOP" }
  - { category: atm_bank,        variable: E, hint: "ATM DAN BANK" }
  - { category: kantor,          variable: E, hint: "KANTOR" }
  - { category: kantor_swasta,   variable: E, hint: "KANTOR SWASTA" }
  - { category: apartemen,       variable: U, hint: "APARTEMEN" }
  - { category: apotek,          variable: U, hint: "APOTEK" }
  - { category: ibadah,          variable: U, hint: "IBADAH" }
  - { category: hiburan,         variable: U, hint: "HIBURAN DAN KESENIAN" }
  - { category: museum,          variable: U, hint: "MUSEUM" }
  - { category: wisata_alam,     variable: U, hint: "WISATA ALAM" }
  - { category: wisata_budaya,   variable: U, hint: "WISATA BUDAYA DAN SEJARAH" }
  # Halte bus TransJakarta. Belum ada di proyek, dan tidak tercakup data
  # stasiun kita yang isinya murni rel. Stasiun MRT dan LRT tidak perlu
  # layer sendiri — sudah ada di tabel stations.
  - { category: halte,           variable: T, hint: "HALTE" }

# Id layer POI tiap wilayah. Kosongkan dengan "" kalau layernya belum diunggah;
# baris kosong dilewati dengan catatan, impornya tidak gagal. Jadi katalog ini
# boleh diisi bertahap sambil unggahannya jalan.
#
# Cari id-nya tanpa membuka dasbor:
#   python -m scripts.list_layers alfamart pusat
#
# Catatan: layer bertanda premium tidak muncul di daftar itu, id-nya harus
# disalin dari dasbor.

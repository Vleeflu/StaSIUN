# Katalog layer GEO MAPID.
#
# layer_id berasal dari rekan tim (branch main, 10 Sep). Yang DIKOREKSI di sini
# hanya pemetaan kategori titik minat ke variabel SEPI — lihat catatan di
# bagian poi_categories dan ADJUSTMENT.md bagian 8.

# Layer turunan OpenStreetMap. Cuma layer ini yang membawa osm_id, dan osm_id
# itu kunci sambungan ke poligon isochrone. Nama TIDAK bisa dipakai sebagai
# kunci: "Halim" dan "Cawang" masing-masing dipakai dua stasiun dari moda
# berbeda.
stations:
  - key: jakpus
    label: Stasiun Jakarta Pusat
    layer_id: "6a8c4f80ba6cb8dfce8ed2cf"
  - key: jakbar
    label: Stasiun Jakarta Barat
    layer_id: "6a9fb9addcb8de4208df0416"
  - key: jaksel
    label: Stasiun Jakarta Selatan
    layer_id: "6a9fbc0cdcb8de4208e06644"
  - key: jaktim
    label: Stasiun Jakarta Timur
    layer_id: "6a9fad6adcb8de4208da29f3"
  - key: jakut
    label: Stasiun Jakarta Utara
    layer_id: "6a9faffedcb8de4208daffe5"

# Poligon jangkauan berjalan kaki, 3 durasi x 5 kota administrasi.
#
# PERINGATAN dari rekan tim, dipertahankan apa adanya karena ini pengetahuan
# lapangan yang tidak bisa ditebak dari luar: proyek GEO MAPID menyimpan
# beberapa layer isochrone BERNAMA SAMA PERSIS, dan sebagian di antaranya
# salah — ada yang kosong, ada yang dihitung memakai profil mobil. Dari luar
# tidak ada bedanya. Karena itu setiap layer WAJIB divalidasi sebelum diimpor
# (profil harus "foot", time_limit harus menit x 60).
isochrones:
  - { key: jakpus, minutes: 5,  layer_id: "6a9fac02753cb27abe00ed93" }
  - { key: jakpus, minutes: 10, layer_id: "6a9fac46753cb27abe010c56" }
  - { key: jakpus, minutes: 15, layer_id: "6a9fac76dcb8de4208d9d0ea" }
  - { key: jakbar, minutes: 5,  layer_id: "6a9fba41753cb27abe07e2ee" }
  - { key: jakbar, minutes: 10, layer_id: "6a9fba82753cb27abe08017f" }
  - { key: jakbar, minutes: 15, layer_id: "6a9fbaa3753cb27abe080c9d" }
  - { key: jaksel, minutes: 5,  layer_id: "6a9fbca2753cb27abe08c9ba" }
  - { key: jaksel, minutes: 10, layer_id: "6a9fbcdb753cb27abe08ceab" }
  - { key: jaksel, minutes: 15, layer_id: "6a9fbd08753cb27abe08d69c" }
  - { key: jaktim, minutes: 5,  layer_id: "6a9fae9b753cb27abe021d1b" }
  - { key: jaktim, minutes: 10, layer_id: "6a9faf65753cb27abe02aa72" }
  - { key: jaktim, minutes: 15, layer_id: "6a9faf95753cb27abe02af43" }
  - { key: jakut,  minutes: 5,  layer_id: "6a9fb113dcb8de4208dbceac" }
  - { key: jakut,  minutes: 10, layer_id: "6a9fb14a753cb27abe038172" }
  - { key: jakut,  minutes: 15, layer_id: "6a9fb179753cb27abe03a590" }

# ============================================================================
# KATEGORI TITIK MINAT — DUA KOREKSI TERHADAP VERSI ASLI
# ============================================================================
#
# KOREKSI 1 — variabel yang disuapi.
# Versi asli memetakan makanan_minuman/coffee_shop/alfamart/indomaret ke
# variabel C, dan atm_bank/kantor ke variabel E. Itu bertentangan dengan PRD
# Tabel 6, yang menetapkan:
#
#   C Komersial : "Jumlah media iklan yang terpasang beserta status tiap titik,
#                  jumlah unit lapak terisi dan kosong, serta indeks sentimen
#                  fasilitas"   -- sumber: Activity (survey), output NLP
#   E Ekonomi   : "Rentang harga pada tingkat klaster tenant, komposisi
#                  kategori usaha, tingkat keterisian ruang komersial"
#                              -- sumber: Activity (daftar tenant hasil survey)
#
# Keduanya bersumber dari kondisi DI DALAM stasiun, hasil survey Activity.
# Titik minat di LUAR stasiun tidak boleh mengisinya. Yang benar menurut PRD:
#
#   U Urban     : "Kepadatan titik minat, indeks keberagaman fungsi lahan,
#                  jumlah pembangkit perjalanan berskala besar"
#                              -- sumber: OpenStreetMap, data profil kawasan
#   T Transport : "...jumlah moda terhubung..."  -- sumber mencakup OpenStreetMap
#
# Jadi seluruh kategori mengisi U, KECUALI halte yang mengisi T.
#
# Titik minat di luar stasiun TETAP dipakai untuk hal lain: komponen supply
# pada GapScore (PRD hal. 13 mewajibkannya mencakup "titik minat di luar
# stasiun maupun tenant yang telah beroperasi di dalam stasiun"). Itu jalur
# terpisah dari SEPI, dan memakai kolom `category`, bukan `fungsi`.
#
# KOREKSI 2 — kategori merek dipisahkan dari fungsi lahan.
# "alfamart" dan "indomaret" adalah MEREK, bukan fungsi lahan. Kalau keduanya
# masuk entropi Shannon sebagai dua kategori berbeda, dua minimarket berbeda
# merek terhitung sebagai dua fungsi lahan berbeda — dan keberagaman kawasan
# jadi menggelembung palsu.
#
# Karena itu ada DUA kolom:
#   category  nama layer asalnya. Dipakai untuk supply GapScore dan penelusuran
#   fungsi    fungsi lahan sesungguhnya. Dipakai untuk entropi Shannon
#
poi_categories:
  - { category: makanan_minuman, fungsi: makanan_minuman,  variable: U, hint: "MAKANAN DAN MINUMAN" }
  - { category: coffee_shop,     fungsi: makanan_minuman,  variable: U, hint: "BRAND COFFEE SHOP" }
  - { category: alfamart,        fungsi: ritel,            variable: U, hint: "ALFAMART" }
  - { category: indomaret,       fungsi: ritel,            variable: U, hint: "INDOMARET" }
  - { category: atm_bank,        fungsi: keuangan,         variable: U, hint: "ATM DAN BANK" }
  - { category: kantor,          fungsi: perkantoran,      variable: U, hint: "KANTOR" }
  - { category: kantor_swasta,   fungsi: perkantoran,      variable: U, hint: "KANTOR SWASTA" }
  - { category: apartemen,       fungsi: hunian,           variable: U, hint: "APARTEMEN" }
  - { category: apotek,          fungsi: kesehatan,        variable: U, hint: "APOTEK" }
  - { category: ibadah,          fungsi: ibadah,           variable: U, hint: "IBADAH" }
  - { category: hiburan,         fungsi: hiburan_rekreasi, variable: U, hint: "HIBURAN DAN KESENIAN" }
  - { category: museum,          fungsi: hiburan_rekreasi, variable: U, hint: "MUSEUM" }
  - { category: wisata_alam,     fungsi: hiburan_rekreasi, variable: U, hint: "WISATA ALAM" }
  - { category: wisata_budaya,   fungsi: hiburan_rekreasi, variable: U, hint: "WISATA BUDAYA DAN SEJARAH" }
  - { category: halte,           fungsi: transportasi,     variable: T, hint: "HALTE" }


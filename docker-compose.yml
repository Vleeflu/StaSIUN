services:
  db:
    image: postgis/postgis:17-3.5
    container_name: stasiun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stasiun
      POSTGRES_PASSWORD: stasiun
      POSTGRES_DB: stasiun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stasiun -d stasiun"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: stasiun-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pre-fills the login server field on the Adminer login page.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    container_name: stasiun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stasiun
      MINIO_ROOT_PASSWORD: stasiun123
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # One-shot job: creates the bucket on startup so the backend doesn't
  # need to handle bucket-creation logic itself. Exits after running.
  minio-init:
    image: minio/mc:latest
    container_name: stasiun-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 stasiun stasiun123 &&
      mc mb --ignore-existing local/stasiun-images &&
      mc anonymous set download local/stasiun-images
      "

  backend:
    build: ./backend
    container_name: stasiun-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Reach Postgres via the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://stasiun:stasiun@db:5432/stasiun
      # Allow the browser-served frontend origin through CORS (JSON list).
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Seed on start: "local" uses the bundled GeoJSON (no credentials),
      # "mapid" pulls live layers (needs the MAPID_* values below).
      SEED_ON_START: "1"
      SEED_SOURCE: "local"
      MAPID_API_KEY: ${MAPID_API_KEY:-}
      MAPID_PROJECT_ID: ${MAPID_PROJECT_ID:-}
      # S3-compatible object storage for images.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: stasiun
      S3_SECRET_KEY: stasiun123
      S3_BUCKET: stasiun-images
      S3_REGION: us-east-1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time. The API URL is what the
        # user's browser uses to reach the backend (host-mapped port).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAPID_KEY: ${NEXT_PUBLIC_MAPID_KEY:-}
    container_name: stasiun-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio_data:
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: stasiun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stasiun
      POSTGRES_PASSWORD: stasiun
      POSTGRES_DB: stasiun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stasiun -d stasiun"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: stasiun-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pre-fills the login server field on the Adminer login page.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    container_name: stasiun-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Reach Postgres via the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://stasiun:stasiun@db:5432/stasiun
      # Allow the browser-served frontend origin through CORS (JSON list).
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Seed on start: "local" uses the bundled GeoJSON (no credentials),
      # "mapid" pulls live layers (needs the MAPID_* values below).
      SEED_ON_START: "1"
      SEED_SOURCE: "local"
      MAPID_API_KEY: ${MAPID_API_KEY:-}
      MAPID_PROJECT_ID: ${MAPID_PROJECT_ID:-}
      # Kunci Activity terpisah dari MAPID_API_KEY (lihat core/config.py).
      MAPID_MISSION_KEY: ${MAPID_MISSION_KEY:-}
      # Kunci yang DIPAKAI endpoint Activity. Namanya menyesatkan: ia bukan
      # cuma untuk basemap, melainkan kunci umum layanan MAPID. Diuji 11 Sep:
      # inilah yang diterima /web/competition/activities.
      MAPID_BASEMAP_KEY: ${MAPID_BASEMAP_KEY:-}
      # Tanpa ini asisten AI mati di jalur Docker walau .env sudah diisi.
      # Base URL dan model ikut diteruskan supaya penyedia bisa diganti dari
      # .env saja, tanpa membangun ulang image.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      # Rantai penyedia cadangan, dipakai begitu kuota harian penyedia
      # utama habis. Tanpa baris ini nilainya berhenti di .env dan tidak
      # pernah sampai ke container - seluruh rantai diam-diam menyusut
      # jadi satu penyedia, dan itu baru ketahuan saat kuota habis.
      LLM_FALLBACKS: ${LLM_FALLBACKS:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time. The API URL is what the
        # user's browser uses to reach the backend (host-mapped port).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAPID_KEY: ${NEXT_PUBLIC_MAPID_KEY:-}
    container_name: stasiun-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:

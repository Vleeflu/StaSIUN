services:
  db:
    image: postgis/postgis:17-3.5
    container_name: stasiun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stasiun
      POSTGRES_PASSWORD: stasiun
      POSTGRES_DB: stasiun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stasiun -d stasiun"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: stasiun-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pre-fills the login server field on the Adminer login page.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    container_name: stasiun-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Reach Postgres via the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://stasiun:stasiun@db:5432/stasiun
      # Allow the browser-served frontend origin through CORS (JSON list).
      # Override in .env for a public server, e.g.
      #   CORS_ORIGINS=["http://203.0.113.5:3000"]
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      # Seed on start: "local" uses the bundled GeoJSON (no credentials),
      # "mapid" pulls live layers (needs the MAPID_* values below). Set
      # SEED_ON_START=0 in .env when restoring a full pg_dump instead of seeding.
      SEED_ON_START: "${SEED_ON_START:-1}"
      SEED_SOURCE: "${SEED_SOURCE:-local}"
      MAPID_API_KEY: ${MAPID_API_KEY:-}
      MAPID_PROJECT_ID: ${MAPID_PROJECT_ID:-}
      # Kunci Activity terpisah dari MAPID_API_KEY (lihat core/config.py).
      MAPID_MISSION_KEY: ${MAPID_MISSION_KEY:-}
      # Kunci yang DIPAKAI endpoint Activity. Namanya menyesatkan: ia bukan
      # cuma untuk basemap, melainkan kunci umum layanan MAPID. Diuji 11 Sep:
      # inilah yang diterima /web/competition/activities.
      MAPID_BASEMAP_KEY: ${MAPID_BASEMAP_KEY:-}
      # Tanpa ini asisten AI mati di jalur Docker walau .env sudah diisi.
      # Base URL dan model ikut diteruskan supaya penyedia bisa diganti dari
      # .env saja, tanpa membangun ulang image.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      # Rantai penyedia cadangan, dipakai begitu kuota harian penyedia
      # utama habis. Tanpa baris ini nilainya berhenti di .env dan tidak
      # pernah sampai ke container - seluruh rantai diam-diam menyusut
      # jadi satu penyedia, dan itu baru ketahuan saat kuota habis.
      LLM_FALLBACKS: ${LLM_FALLBACKS:-}
    ports:
      - "8000:8000"

  # Penyegar data terjadwal. TIDAK ikut `docker compose up` biasa; ia hidup
  # hanya lewat `docker compose --profile jadwal up -d scheduler`.
  #
  # Dipisah dari backend dengan sengaja. Menaruh penjadwal di dalam proses API
  # berarti tiap penempatan ulang backend membunuh penyegaran yang sedang
  # berjalan di tengah jalan, dan itu sudah terbukti terjadi: satu penarikan
  # guna lahan yang sudah 60% selesai hilang karena container-nya dibuat ulang
  # untuk alasan yang sama sekali tidak berhubungan.
  #
  # Ia memakai image backend yang sama, jadi tidak ada dependensi kedua yang
  # harus dijaga selaras.
  scheduler:
    build: ./backend
    container_name: stasiun-scheduler
    profiles: ["jadwal"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://stasiun:stasiun@db:5432/stasiun
      MAPID_API_KEY: ${MAPID_API_KEY:-}
      MAPID_PROJECT_ID: ${MAPID_PROJECT_ID:-}
      MAPID_MISSION_KEY: ${MAPID_MISSION_KEY:-}
      MAPID_BASEMAP_KEY: ${MAPID_BASEMAP_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_FALLBACKS: ${LLM_FALLBACKS:-}
      # Jam berapa penyegaran harian dijalankan, waktu UTC. 19.00 UTC = 02.00
      # WIB, saat Overpass paling lengang dan tidak ada yang membuka aplikasi.
      JAM_HARIAN: ${JAM_HARIAN:-19}
      # Hari penyegaran lambat (tarik ulang Overpass). 6 = Minggu.
      HARI_MINGGUAN: ${HARI_MINGGUAN:-6}
    command: ["python", "-u", "-m", "scripts.penjadwal"]

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time. The API URL is what the
        # user's browser uses to reach the backend (host-mapped port).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAPID_KEY: ${NEXT_PUBLIC_MAPID_KEY:-}
    container_name: stasiun-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:

<text x="398" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Asisten berbasis data</text>
<text x="398" y="199" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Model bahasa dibekali seluruh daftar stasiun dari basis data — nama, kode KAI, lin, status — beserta</text>
<text x="398" y="211" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">penjelasan metode SEPI. Konteksnya disusun ulang setiap pertanyaan supaya selalu ikut data terbaru.</text>
<rect x="376" y="258" width="8" height="8" fill="#9aa0a6"/>
<text x="398" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Chip konteks</text>
<text x="398" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Stasiun yang sedang dibuka otomatis menjadi konteks, sehingga pertanyaan seperti “lin apa saja di sini”</text>
<text x="398" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">punya rujukan. Bisa dilepas lewat tanda silang untuk bertanya hal umum.</text>
<rect x="376" y="334" width="8" height="8" fill="#9aa0a6"/>
<text x="398" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Pagar kejujuran</text>
<text x="398" y="351" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Asisten dilarang mengarang angka. Ditanya skor SEPI atau footfall, dia menyatakan datanya belum ada lalu</text>
<text x="398" y="363" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">menjelaskan bagaimana nanti dihitung.</text>

<text x="388" y="271" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Skor dan peringkatnya berasal dari mesin skoring yang sudah berjalan: TOPSIS di atas bobot gabungan Entropy</text>
<text x="388" y="283" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">dan AHP, dihitung di dalam poligon isochrone. Panjang bar dibandingkan dengan komponen tertinggi di stasiun</text>
<text x="388" y="295" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">itu sendiri, dan angka mentahnya tetap ditulis di sebelahnya lengkap dengan satuannya.</text>
<rect x="366" y="338" width="8" height="8" fill="#9aa0a6"/>
<text x="388" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Bobot AHP</text>
<text x="388" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Perbandingan berpasangannya masih angka sementara dan harus diganti hasil kesepakatan tim. Consistency</text>
<text x="388" y="367" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">ratio diperiksa tiap kali dihitung; kalau mencapai 0,10 skoringnya berhenti.</text>
<rect x="366" y="410" width="8" height="8" fill="#9aa0a6"/>
<text x="388" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Profil stasiun</text>
<text x="388" y="427" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Satu-satunya blok bergaris utuh di panel ini: kode KAI, lin dilayani, status dilayani atau dilintasi,</text>
<text x="388" y="439" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">kecamatan, alamat, dan koordinat. Semuanya diambil langsung dari basis data.</text>
<rect x="366" y="482" width="8" height="8" fill="#9aa0a6"/>
<text x="388" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" font-weight="700" text-anchor="start">Menunggu data</text>
<text x="388" y="499" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Footfall, dwell-time, dan arketipe LDA sengaja ditampilkan kosong supaya kebutuhan datanya terbaca sejak</text>
<text x="388" y="511" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">awal, bukan disembunyikan.</text>

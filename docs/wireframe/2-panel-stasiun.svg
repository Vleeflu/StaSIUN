<text x="388" y="199" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">Ikhtisar sudah berisi data asli dari basis data. Ad-Space, Tenant, dan Naming masih berupa kerangka kosong</text>
<text x="388" y="211" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">dengan keterangan bahwa modulnya belum dibangun.</text>
